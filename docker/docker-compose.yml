version: '3.8'

# ==============================================================================
# The Hive — Standalone Node Compose Specification
# ==============================================================================

networks:
  hive-net:
    driver: bridge

volumes:
  mariadb_data:
  cloudbeaver_data:
  postgres_data:
  n8n_data:

services:
  mariadb:
    image: mariadb:11.4
    container_name: hive-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hive_secure_root_password
      MYSQL_DATABASE: homelab
      MYSQL_USER: hive_admin
      MYSQL_PASSWORD: hive_secure_admin_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../sql/01_schema_init.sql:/docker-entrypoint-initdb.d/01_schema_init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - hive-net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: hive-cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - mariadb
    networks:
      - hive-net

  postgres:
    image: postgres:14.2
    container_name: hive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hive-net

  glances:
    image: nicolargo/glances:latest-full
    container_name: hive-glances
    restart: unless-stopped
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "61208:61208"
    networks:
      - hive-net
