version: '3.8'

# ==============================================================================
# The Hive — Multi-Node Docker Swarm Production Stack
# Cluster: claude (Manager, 192.168.100.121) | gpt (Worker, 192.168.100.126)
# ==============================================================================

networks:
  swarm-overlay:
    driver: overlay
    attachable: true

volumes:
  mariadb_data:
    driver: local
  cloudbeaver_data:
    driver: local
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  pihole_data:
    driver: local
  pihole_dnsmasq:
    driver: local
  jellyfin_config:
    driver: local
  jellyfin_cache:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Database Layer (Persistent SQL Storage)
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: homelab
      MYSQL_USER: hive_admin
      MYSQL_PASSWORD_FILE: /run/secrets/db_user_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/01_schema_init.sql:/docker-entrypoint-initdb.d/01_schema_init.sql:ro
    networks:
      - swarm-overlay
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - swarm-overlay
    ports:
      - "8978:8978"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
      restart_policy:
        condition: on-failure

  postgres-n8n:
    image: postgres:14.2
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swarm-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
      restart_policy:
        condition: on-failure

  # ----------------------------------------------------------------------------
  # Automation & Orchestration Services
  # ----------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:2.34.4
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - N8N_HOST=192.168.100.121
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://192.168.100.121:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - swarm-overlay
    ports:
      - "5678:5678"
    depends_on:
      - postgres-n8n
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Cluster Management & Telemetry
  # ----------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.21.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - swarm-overlay
    deploy:
      mode: global
      placement:
        preferences:
          - spread: node.id

  portainer:
    image: portainer/portainer-ce:2.21.5
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    ports:
      - "9000:9000"
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - swarm-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  glances:
    image: nicolargo/glances:latest-full
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "61208:61208"
      - "61209:61209"
    deploy:
      mode: global

  # ----------------------------------------------------------------------------
  # Security, DNS & OSINT
  # ----------------------------------------------------------------------------
  pihole:
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'Europe/Budapest'
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    networks:
      - swarm-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  spiderfoot:
    image: spiderfoot:local
    ports:
      - "5001:5001"
    networks:
      - swarm-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
